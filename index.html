<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ayame's Sanctuary V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700;800&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'kawaii': ['"M PLUS Rounded 1c"', 'sans-serif'],
                        'eng': ['"Quicksand"', 'sans-serif']
                    },
                    colors: {
                        'sakura': '#FFF0F5',
                        'cream': '#FFFDF9',
                        'glass-border': 'rgba(255, 255, 255, 0.8)',
                    },
                    animation: {
                        'heartbeat': 'heartbeat 1.5s infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.05)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(180deg, #fff0f5 0%, #fffdf9 100%);
            font-family: 'kawaii', sans-serif;
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sakura Animation */
        .sakura {
            position: fixed;
            top: -10vh;
            background-color: #ffb7b2;
            border-radius: 100% 0 100% 0;
            opacity: 0.8;
            animation: fall linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(100px, 110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.2);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 10;
        }

        .glass-card:active {
            transform: scale(0.98);
        }

        /* Game Elements */
        .falling-heart {
            position: fixed;
            top: -50px;
            font-size: 2rem;
            cursor: pointer;
            z-index: 100;
            animation: fall-heart 4s linear forwards;
            user-select: none;
        }

        @keyframes fall-heart {
            to {
                transform: translateY(110vh);
            }
        }

        /* Roulette Wheel */
        .wheel-container {
            width: 250px;
            height: 250px;
            position: relative;
            margin: 0 auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
            background: conic-gradient(#FFB7B2 0deg 72deg,
                    #FFDAC1 72deg 144deg,
                    #E2F0CB 144deg 216deg,
                    #B5EAD7 216deg 288deg,
                    #C7CEEA 288deg 360deg);
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #FF69B4;
            z-index: 20;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.1));
        }

        .neko-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            z-index: 50;
            cursor: pointer;
        }
    </style>
</head>

<body class="text-gray-600 select-none">

    <!-- Header -->
    <header class="text-center pt-8 pb-4 sticky top-0 z-40 bg-white/30 backdrop-blur-md border-b border-white/20 mb-6">
        <h1 class="text-2xl font-extrabold text-pink-400 tracking-wider drop-shadow-sm">あやめのサンクチュアリ V8</h1>
        <p class="text-[10px] text-gray-400 font-bold tracking-[0.3em] uppercase mt-1 px-4">Ethereal Love Interface</p>
    </header>

    <div class="max-w-md mx-auto px-5 space-y-8 relative z-10">

        <!-- A. LOVE ROULETTE -->
        <section class="glass-card p-6 text-center overflow-hidden">
            <h2 class="text-pink-400 font-bold text-lg mb-4">🎡 ラブルーレット (運試し)</h2>
            <div class="wheel-container mb-4">
                <div class="wheel-pointer"></div>
                <div id="wheel" class="wheel"></div>
            </div>
            <p id="roulette-result" class="h-6 text-sm font-bold text-gray-500 mb-3">回してね！</p>
            <button onclick="spinWheel()"
                class="bg-pink-400 text-white px-8 py-2 rounded-full font-bold shadow-lg hover:bg-pink-500 transition active:scale-95">START</button>
        </section>

        <!-- B. CATCH THE HEART GAME -->
        <section class="glass-card p-6 text-center border-t-4 border-t-red-300">
            <h2 class="text-red-400 font-bold text-lg mb-2">🎮 ハートキャッチ</h2>
            <p class="text-xs text-gray-500 mb-4">10個集めてね！ Score: <span id="score"
                    class="font-bold text-xl text-pink-500">0</span></p>
            <button onclick="startGame()" id="start-game-btn"
                class="w-full bg-red-300 text-white font-bold py-3 rounded-xl shadow-md hover:bg-red-400 active:scale-95 transition">
                ゲーム開始 (Start)
            </button>
            <div id="secret-message"
                class="hidden mt-4 p-3 bg-white/50 rounded-xl border border-pink-200 animate-bounce">
                <p class="text-sm font-bold text-pink-500">🎉 あやめちゃんは僕の宇宙だよ！ 🎉</p>
                <p class="text-[10px] text-gray-400">(Ayame, you are my universe)</p>
            </div>
        </section>

        <!-- D. MIMOS & ROMANCE -->
        <section class="glass-card p-6 text-center border border-pink-100">
            <h2 class="text-pink-400 font-bold text-lg mb-1">💖 甘えんぼモード (Mimos)</h2>
            <button onclick="sendLove('URGENT: 今すぐハグが必要！ (充電切れ)', '🪫')"
                class="w-full bg-gradient-to-r from-pink-300 to-rose-300 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all mb-4 animate-heartbeat flex items-center justify-center gap-2">
                <span class="text-2xl">💓</span>
                <span>緊急：充電切れ (HUG ME)</span>
            </button>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="sendLove('声が聞きたいな', '📞')"
                    class="bg-white/50 p-2 rounded-xl text-[10px] font-bold hover:bg-pink-50 border border-pink-50">声聞きたい</button>
                <button onclick="sendLove('自撮りが見たいな', '📸')"
                    class="bg-white/50 p-2 rounded-xl text-[10px] font-bold hover:bg-pink-50 border border-pink-50">自撮り頂戴</button>
                <button onclick="sendLove('寝落ち通話したい', '💤')"
                    class="bg-white/50 p-2 rounded-xl text-[10px] font-bold hover:bg-pink-50 border border-pink-50">寝落ち通話</button>
            </div>
        </section>

        <!-- E. FOOD & CAFE -->
        <section class="glass-card p-5 border-l-4 border-l-yellow-300">
            <h2 class="text-yellow-500 font-bold text-lg mb-3">🍰 カフェ & ご飯</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="sendFood('スタバ行きたい', '☕')"
                    class="bg-white/50 p-3 rounded-xl text-xs font-bold text-gray-600 border hover:bg-yellow-50">☕ スタバ
                    (Starbucks)</button>
                <button onclick="sendFood('Uber Eats 頼みたい', '🍔')"
                    class="bg-white/50 p-3 rounded-xl text-xs font-bold text-gray-600 border hover:bg-yellow-50">🍔 Uber
                    Eats</button>
                <button onclick="sendFood('お寿司食べたい', '🍣')"
                    class="bg-white/50 p-3 rounded-xl text-xs font-bold text-gray-600 border hover:bg-yellow-50">🍣 お寿司
                    (Sushi)</button>
                <button onclick="sendFood('甘いもの食べたい', '🍦')"
                    class="bg-white/50 p-3 rounded-xl text-xs font-bold text-gray-600 border hover:bg-yellow-50">🍦 スイーツ
                    (Sweets)</button>
            </div>
        </section>

        <!-- F. HEALTH (LUNA MODE) -->
        <section class="glass-card p-5 border-l-4 border-l-purple-300">
            <h2 class="text-purple-400 font-bold text-lg mb-3">🌙 ルナモード (体調)</h2>
            <div class="flex gap-2 mb-3">
                <button onclick="sendHealth('少し痛い', '🧸')"
                    class="flex-1 bg-white/40 p-2 rounded-lg text-xs font-bold border hover:bg-purple-50">🧸 少し</button>
                <button onclick="sendHealth('痛い', '💊')"
                    class="flex-1 bg-white/40 p-2 rounded-lg text-xs font-bold border hover:bg-purple-50">💊 普通</button>
                <button onclick="sendHealth('激痛 SOS', '🚑')"
                    class="flex-1 bg-white/40 p-2 rounded-lg text-xs font-bold border hover:bg-red-50 text-red-400">🚑
                    SOS</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="sendHealth('頭痛薬ほしい', '💊')"
                    class="text-[10px] bg-white/30 p-2 rounded border">頭痛薬</button>
                <button onclick="sendHealth('眠れない', '🌙')"
                    class="text-[10px] bg-white/30 p-2 rounded border">不眠</button>
                <button onclick="sendHealth('お風呂沸かして', '🛁')"
                    class="text-[10px] bg-white/30 p-2 rounded border">お風呂</button>
            </div>
        </section>

        <!-- G. FINANCIAL SUPPORT -->
        <section class="glass-card p-5 border-b-4 border-b-green-300">
            <h2 class="text-green-500 font-bold text-lg mb-2">💴 お小遣い & サポート</h2>
            <div class="flex gap-2 items-center mb-3 bg-white/30 p-2 rounded-xl border border-white">
                <span class="text-xl text-gray-400">¥</span>
                <input type="number" id="yen-input" placeholder="0"
                    class="w-full bg-transparent text-xl font-bold text-gray-700 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <button onclick="sendMoneyRequest('タクシー代')"
                    class="bg-white/50 p-2 rounded-lg text-xs font-bold hover:bg-green-50">🚕 タクシー</button>
                <button onclick="sendMoneyRequest('コンビニ代')"
                    class="bg-white/50 p-2 rounded-lg text-xs font-bold hover:bg-green-50">🏪 コンビニ</button>
                <button onclick="sendMoneyRequest('病院/薬代')"
                    class="bg-white/50 p-2 rounded-lg text-xs font-bold hover:bg-green-50">🏥 病院・薬</button>
                <button onclick="sendMoneyRequest('緊急SOS')"
                    class="bg-red-100 text-red-500 p-2 rounded-lg text-xs font-bold hover:bg-red-200">🚨 緊急SOS</button>
            </div>
        </section>

        <!-- H. AMAZON WISHLIST -->
        <section class="glass-card p-5 border-t-4 border-t-orange-200">
            <h2 class="text-orange-400 font-bold text-lg mb-2">🎁 Amazon ほしい物</h2>
            <input type="text" id="wish-input" placeholder="リンクを貼り付け..."
                class="w-full bg-white/40 p-2 rounded-xl mb-3 text-sm outline-none border border-white">
            <button onclick="sendWish()"
                class="w-full bg-orange-300 text-white font-bold py-2 rounded-xl shadow-md hover:bg-orange-400 active:scale-95 transition">
                おねだりする (Add to Cart) 🛍️
            </button>
        </section>

    </div>

    <!-- Guardian Neko -->
    <div class="neko-container animate-float group" onclick="nekoSpeak()">
        <div id="neko-bubble"
            class="absolute bottom-[85px] right-0 bg-white px-3 py-2 rounded-xl shadow-lg border border-pink-100 text-xs font-bold text-pink-400 opacity-0 transition-opacity whitespace-nowrap z-50">
            ...
        </div>
        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md filter hover:brightness-110 transition-all">
            <g>
                <path d="M50 25 C30 25 15 45 15 65 C15 85 30 95 50 95 C70 95 85 85 85 65 C85 45 70 25 50 25"
                    fill="#2d3436" />
                <polygon points="25 35 15 10 45 25" fill="#2d3436" />
                <polygon points="75 35 85 10 55 25" fill="#2d3436" />
                <circle cx="35" cy="55" r="4" fill="#ffffff" />
                <circle cx="65" cy="55" r="4" fill="#ffffff" />
                <path d="M45 65 Q50 70 55 65" stroke="#ff7675" stroke-width="2" fill="none" opacity="0.6" />
            </g>
        </svg>
    </div>

    <script>
        const IFTTT_KEY = "ds4eE-OmNMcnFWVlP6_UKIX1XLy4e_WSX4PDPGrsvV8";
        const EVENT_NAME = "Ayame_Alert";

        // --- VISUALS: SAKURA ---
        function createSakura() {
            const petal = document.createElement('div');
            petal.classList.add('sakura');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 2 + 's';
            petal.style.opacity = Math.random();
            petal.style.width = petal.style.height = Math.random() * 10 + 5 + 'px';
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createSakura, 300);

        // --- IFTTT LOGIC ---
        function triggerIFTTT(v1, v2 = "", v3 = "") {
            const url = `https://maker.ifttt.com/trigger/${EVENT_NAME}/with/key/${IFTTT_KEY}?value1=${encodeURIComponent(v1)}&value2=${encodeURIComponent(v2)}&value3=${encodeURIComponent(v3)}`;

            // Toast / Feedback
            const originalTitle = document.title;
            document.title = "送信中... 🚀";

            return fetch(url, { mode: 'no-cors' })
                .then(() => {
                    document.title = "送信完了! ✅";
                    setTimeout(() => document.title = originalTitle, 2000);
                    showToast("送信完了しました！ ✨");
                })
                .catch(err => console.error(err));
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg z-50 animate-bounce';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // --- 1. ROULETTE ---
        function spinWheel() {
            const wheel = document.getElementById('wheel');
            const resultText = document.getElementById('roulette-result');
            const prizes = ['ハグ券 (Hug)', 'キス (Kiss)', '10分電話', '秘密のご褒美', '好き♡ (Love)'];
            const deg = Math.floor(5000 + Math.random() * 5000); // Random Big Spin

            wheel.style.transform = `rotate(${deg}deg)`;
            resultText.textContent = "・・・";

            setTimeout(() => {
                const actualDeg = deg % 360;
                // Simple random mapping for specific prize demo (accurate math requires segment logic)
                const prize = prizes[Math.floor(Math.random() * prizes.length)];
                resultText.textContent = `結果: ${prize} 🎉`;
                triggerIFTTT(`🎰 ルーレット結果: ${prize}`, "Game Result", "Win");
            }, 4000);
        }

        // --- 2. CATCH HEART ---
        let score = 0;
        let gameActive = false;

        function startGame() {
            if (gameActive) return;
            gameActive = true;
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('start-game-btn').disabled = true;
            document.getElementById('start-game-btn').textContent = "Game Active...";

            const interval = setInterval(() => {
                if (score >= 10) {
                    clearInterval(interval);
                    endGame();
                    return;
                }
                spawnHeart();
            }, 800);
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.textContent = '❤️';
            h.className = 'falling-heart';
            h.style.left = Math.random() * 80 + 10 + '%';
            h.onclick = () => {
                score++;
                document.getElementById('score').textContent = score;
                h.remove();
                if (score >= 10) endGame();
            };
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }

        function endGame() {
            gameActive = false;
            document.getElementById('secret-message').classList.remove('hidden');
            document.getElementById('start-game-btn').textContent = "クリア！ (Clear)";
            triggerIFTTT("🎮 ゲームクリア！: Ayame is my universe", "Game", "Win");
            confetti();
        }

        function confetti() {
            for (let i = 0; i < 50; i++) {
                createSakura(); // Reusing sakura as confetti burst
            }
        }

        // --- 3. NEKO ---
        const nekoPhrases = ['今日も可愛いね', '無理しないで', '大好きだよ', 'ずっと一緒だよ', 'お疲れ様'];
        function nekoSpeak() {
            const bubble = document.getElementById('neko-bubble');
            bubble.textContent = nekoPhrases[Math.floor(Math.random() * nekoPhrases.length)];
            bubble.style.opacity = '1';
            setTimeout(() => bubble.style.opacity = '0', 2500);
        }

        // --- HANDLERS ---
        function sendLove(msg, emoji) {
            triggerIFTTT(`❤️ ${msg} ${emoji}`, "甘えんぼモード", "Urgent");
        }

        function sendFood(msg, emoji) {
            triggerIFTTT(`🍔 ${msg} ${emoji}`, "カフェ・ご飯", "Request");
        }

        function sendHealth(msg, emoji) {
            triggerIFTTT(`🌙 体調: ${msg} ${emoji}`, "ルナモード", "Health");
        }

        function sendMoneyRequest(type) {
            const amount = document.getElementById('yen-input').value;
            if (!amount) return document.getElementById('yen-input').focus();
            triggerIFTTT(`💴 ${type}: ¥${amount}`, "金銭的サポート", "Money");
        }

        function sendWish() {
            const wish = document.getElementById('wish-input').value;
            if (!wish) return document.getElementById('wish-input').focus();
            triggerIFTTT(`🎁 ほしい物: ${wish}`, "Amazon", "Wishlist");
            document.getElementById('wish-input').value = "";
        }

    </script>
</body>

</html>
