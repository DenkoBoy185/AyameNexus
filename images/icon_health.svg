<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  <!-- Sticker Border -->
  <path d="M50,15 C75,15 90,35 90,60 C90,85 70,95 50,95 C30,95 10,85 10,60 C10,35 25,15 50,15" fill="white" stroke="#FFE4E1" stroke-width="5" filter="url(#sticker-shadow)"/>
  
  <!-- Heart -->
  <path d="M50,80 C20,60 15,40 15,35 A15,15 0 0,1 45,35 L50,40 L55,35 A15,15 0 0,1 85,35 C85,40 80,60 50,80" fill="#FFB7B2" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bandage -->
  <rect x="30" y="45" width="40" height="10" rx="5" fill="#FFF0F5" transform="rotate(-15 50 50)" stroke="#FFB7B2" stroke-width="2"/>
  <circle cx="45" cy="48" r="1" fill="#FFB7B2" transform="rotate(-15 50 50)"/>
  <circle cx="55" cy="51" r="1" fill="#FFB7B2" transform="rotate(-15 50 50)"/>
  
  <!-- Kawaii Face on Heart -->
  <circle cx="40" cy="55" r="2" fill="#5D5D5D"/>
  <circle cx="60" cy="55" r="2" fill="#5D5D5D"/>
  
  <!-- Sweat drop (Tear) -->
  <path d="M65,40 Q65,35 68,38 Q71,41 68,44 Q65,41 65,40" fill="#E0F7FA" stroke="#4FC3F7" stroke-width="1"/>
</svg>
