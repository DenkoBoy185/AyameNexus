<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  <!-- Sticker Border -->
  <circle cx="50" cy="50" r="45" fill="white" stroke="#FFCDD2" stroke-width="5" filter="url(#sticker-shadow)"/>
  
  <!-- Wings (Flying away money) -->
  <path d="M15,40 Q5,30 15,20 Q25,10 35,30" fill="#E0F7FA" stroke="#B2EBF2" stroke-width="2"/>
  <path d="M85,40 Q95,30 85,20 Q75,10 65,30" fill="#E0F7FA" stroke="#B2EBF2" stroke-width="2"/>

  <!-- Bill -->
  <rect x="25" y="35" width="50" height="30" rx="3" fill="#C8E6C9" stroke="#81C784" stroke-width="2"/>
  <circle cx="50" cy="50" r="8" fill="#A5D6A7"/>
  <text x="50" y="54" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32" font-weight="bold">$</text>
  
  <!-- Crying Face on Bill -->
  <line x1="35" y1="45" x2="40" y2="48" stroke="#2E7D32" stroke-width="2"/>
  <line x1="60" y1="45" x2="65" y2="42" stroke="#2E7D32" stroke-width="2"/>
  <path d="M45,55 Q50,52 55,55" fill="none" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- Tears -->
  <path d="M30,60 Q30,65 35,70" fill="none" stroke="#4FC3F7" stroke-width="2"/>
  <path d="M70,60 Q70,65 65,70" fill="none" stroke="#4FC3F7" stroke-width="2"/>
</svg>
